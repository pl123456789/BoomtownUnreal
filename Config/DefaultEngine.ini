; Our terrain (AOverworldHeightfield, AGravelBarSite) is generated procedurally at BeginPlay, not
; present in the level at edit time, so the navmesh must rebuild at runtime after it spawns.
[/Script/NavigationSystem.NavigationSystemV1]
bAutoCreateNavigationData=True

; RuntimeGeneration is a property of ARecastNavMesh/ANavigationData, not UNavigationSystemV1 - it does
; nothing under the section above. Without this, RecastNavMesh instances default to Static generation
; and never rebuild tiles at runtime, so click-to-move can never find a path.
[/Script/NavigationSystem.RecastNavMesh]
RuntimeGeneration=Dynamic

